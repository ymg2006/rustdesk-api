# System Language, en-US
lang: "en-US"

# Application Basic Configuration Modules
app:
  web-client: 1  # Web-based remote control client switch: 1 Enabled, 0 Disabled
  register: true # Whether to enable user self-registration function, false disables registration
  register-status: 2 # Newly registered users' default account status: 1. Normally enabled 2. Disabled and locked
  captcha-threshold: 3 # CAPTCHA trigger threshold: <0 Permanently disable CAPTCHA; 0 CAPTCHA on every login; >0 Enable CAPTCHA after N consecutive failed login attempts.
  ban-threshold: 10 # Login failure ban threshold: 0 disables automatic ban; >0 automatically bans the account after a certain number of consecutive incorrect password attempts.
  ban-window-minutes: 15 # A sliding window (minutes) for counting consecutive failed login attempts, default 15; older failed login records outside the window will be automatically cleared.
  ban-duration-minutes: 30 # The duration (in minutes) during which this IP address will be banned from logging in after the ban is triggered, default 30.
  show-swagger: 0 # Whether to display API documentation Swagger: 1 for enabled, 0 for disabled (recommended to disable in production environments)
  token-expire: 7200h # Login Token Validity Period
  web-sso: true # Enable Web Single Sign-On (SSO) capability
  disable-pwd-login: false # Disable account and password login, false: retain password login
  invite-only: true # Enable Invitation Code Mode

# Backend Management Panel Configuration Module
admin:
  title: "RustDesk" # Management Backend Page Title
  hello-file: "./conf/admin/hello.html" # Configure a custom HTML file for the admin backend homepage; load the file content first after configuration.
  hello: ""# Custom text content for the admin backend homepage: This field is invalid if hello-file exists.
  # ID server and relay server ports, refer to official issue #257
  id-server-port: 21116 # ID server listening port (used to start the server using the command)
  relay-server-port: 21117 # Listening port for the relay server (used to start the server using the command).
  relay-stats-host: "127.0.0.1" # hbbr load/connection count query address (local loopback only, api-server must be on the same machine as hbbr)

# Gin Web Framework Related Configurations
gin:
  api-addr: "0.0.0.0:21114" # API service listening address and port, 0.0.0.0, allows all network cards to access from the external network.
  mode: "release" # Gin running modes: release (production)/debug/test
  resources-path: 'resources' # Directory for storing static resource files, accessible to the public.
  trust-proxy: "127.0.0.1" # Trust the reverse proxy IP. Entering the proxy address will ensure the correct acquisition of the real client IP. Leaving it blank will disable the function.

# General configuration for GORM database (ORM framework)
gorm:
  type: "sqlite" # General GORM Database Configuration (ORM Framework) # Default database types: sqlite/mysql/postgresql. Switching databases requires modifying the corresponding database configuration.
  max-idle-conns: 10 # Maximum number of idle connections in the database connection pool
  max-open-conns: 100 # Maximum number of concurrent open connections in a database connection pool

# MySQL database connection configuration, takes effect when type=mysql
mysql:
  username: "" # MySQL database username
  password: "" # MySQL database password
  addr: "" # MySQL connection address, format: ip:port
  dbname: "" # Database name to connect to
  tls: "false" # MySQL TLS encryption switch: true for on/false for off/skip-verify to skip certificate verification/custom for custom certificates

# PostgreSQL database connection configuration, takes effect when type=postgresql
postgresql:
  host: "127.0.0.1" # PG database address
  port: "5432" # PG default port 5432
  user: "" # PG login username
  password: "" # PG login password
  dbname: "postgres" # Default database name
  sslmode: "disable" # SSL encryption mode: disable to turn off / require to force to turn on / verify-ca to verify CA certificate / verify-full to fully verify certificate
  time-zone: "Asia/Shanghai" # PG connection session time zone, Shanghai East 8 zone

# RustDesk core service address configuration
rustdesk:
  id-server: "183.24.70.210:21116" # Self-built ID server address and port, used for client connection
  relay-server: "183.24.70.210:21117" # Self-built relay forwarding server address and port
  api-server: "https://183.24.70.210:21120" # This API service's own access address
  key: "yJ0zQ1ETilzNC02PeFttuPl5x5EfA4WN5fAFh0YVzPQ=" # Ed25519 encrypted public key string, choose one of the following configuration options: key/key-file
  key-file: "" # Path to the Ed25519 public key file, which has higher priority than the key field.
  personal: 1 # Personal Address Book Mode Switch 1 Off, On: Only personal address book can be used
  webclient-magic-queryonline: 1 # Web client online status query optimization switch, 0 off, 1 on
  ws-host: ""  # Custom WebSocket address, example: wss://192.168.1.3:4443, if empty, the default address will be used automatically.

# Log output configuration
logger:
  path: "./runtime/log.txt" # Log file storage path
  level: "info" # Log printing levels: trace (most verbose) > debug > info > warn > error > fatal (fatal errors only)
  report-caller: true # Whether to print the line number and file name of the called code in the log. Enabled with true, it facilitates debugging.

# Global network proxy configuration
proxy:
  enable: false # Enable global proxy access to the external network?
  host: "http://127.0.0.1:1080" # Proxy service address, either HTTP or SOCKS proxy is acceptable.

# JWT Login Authentication Configuration
jwt:
  key: "5YPnK3NDchxAHuB6r8BpyEtFbvQcCyMUFupcKzxRsDxDurkc" # JWT signing key must be a custom, complex string to ensure security.
  expire-duration: 168h # JWT token expiration time is the same as token-expire, 7 days.

# Cross-Origin Access Configuration (CORS)
cors:
# Whitelist of allowed cross-origin requests (YAML list). Only Origins that match the list will be reflected and have their credentials headers returned.
# For example: ["https://admin.example.com", "https://app.example.com"]
# Leaving it blank ([]) disables cross-origin requests: Any cross-origin request will not receive Access-Control-Allow-Origin, and the browser will block the response.
# Note: This only controls the response headers and will not affect same-origin admin backends/WebClients (same-origin requests do not require CORS).
  allow-origins: []

# Code payment configuration (self-implemented, no external platform dependency)
payment:
  enable: false # Enable code payment?
  secret_key: "5YPnK3NDchxAHuB6r8BpyEtFbvQcCyMUFupcKzxRsDxDurkc" # Signature key (used for signature verification in callback notifications)
  notify_url: "https://183.24.70.210:21120/api/subscribe/notify" # Callback address
  order_expire_sec: 600 # Orders will be automatically closed if not paid (in seconds)

  # Cashier Display
  cashier:
    site_name: "RustDesk Subscription"
    alipay_qr: "static/qr/test2.jpg" # Alipay QR code
    wechat_qr: "static/qr/test.jpg" # WeChat payment code
    monitor_tip: "After scanning the QR code to pay, wait a few seconds, and the system will automatically detect the account and activate the subscription."

# Subscription Package Configuration
subscription:
  plan: "pro"
  plans:
    - key: "1m"
      name: "1 month"
      price_cents: 1000
      period_days: 30
    - key: "3m"
      name: "3 months"
      price_cents: 2800
      period_days: 90
    - key: "6m"
      name: "6 months"
      price_cents: 5000
      period_days: 180
    - key: "12m"
      name: "12 months"
      price_cents: 8800
      period_days: 365
    - key: "forever"
      name: "permanent"
      price_cents: 18800
      period_days: 36500
  remind_days: [7, 3, 1] # Number of days until expiration (for front-end use)

# Number of days for near-expiration reminder (for frontend use) av# TOTP clock tolerance (number of clock drift cycles, 30s per cycle; Skew=N, meaning tolerance ±30s×N).
# The standard library defaults to Skew=1 (±30s). Occasionally, server/client clock deviations or user input latency may cause failures.
# Here, a default of 3 (±90s) is used for robustness. Values ​​<1 (including unconfigured/0) will fall back to 3 by the service.
# If the "always" check fails, priority should be given to checking whether mfa_secret is correctly stored in the database and whether the time is synchronized, rather than allowing unlimited tolerance.
mfa_totp_skew: 3

# Configure LDAP domain account synchronization login (AD/OpenLDAP)
ldap:
  enable: false # Enable LDAP single sign-on, false disables it.
  url: "ldap://ldap.example.com:389" # LDAP service connection address, 389 is unencrypted by default, 636 is the LDAP encrypted port.
  tls-ca-file: "" # LDAP TLS Encrypted CA Certificate File Path
  tls-verify: false # Should certificate validity be verified during TLS connection?
  base-dn: "dc=example,dc=com" #LDAP root domain DN
  bind-dn: "cn=admin,dc=example,dc=com" # LDAP administrator binds account DN for querying users.
  bind-password: "password" # LDAP administrator account password
  user:
    base-dn: "ou=users,dc=example,dc=com" # Organizational Unit (DN) where user data is located
    enable-attr: "" # User enabled status attribute name; in AD environment, enter userAccountControl, leaving it blank means all users are enabled by default.
    enable-attr-value: "" # User activation status corresponding attribute value; AD environment does not need to be filled in and will be automatically ignored.
    filter: "(cn=*)" # LDAP user query filter conditions, matching all .cn users
    username: "uid" # Login account corresponds to LDAP attribute; Windows AD needs to be changed to sAMAccountName
    email: "mail" # LDAP field name corresponding to the user's email address
    first-name: "givenName" # Username field
    last-name: "sn" # User's last name field
    sync: false # User synchronization logic: true: Synchronize user data to the database upon login; false: Synchronize only upon user creation.
    admin-group: "cn=admin,dc=example,dc=com" # Administrator user group DN, members of this group have backend administrator privileges after logging in.
    allow-group: "cn=users,dc=example,dc=com" # Allowed user group IDs to log in; only accounts within this group can log in to the system.

# Service Timeout and Optional TLS (Security Hardening)
# Default is plaintext HTTP; in production environments, it is recommended to use a front-end reverse proxy (nginx, etc.) for TLS termination. This service only listens on internal network ports.
server:
  # Read Timeout (seconds): The time limit for reading the entire request (including the body), preventing slow attack attacks. Default: 15
  read-timeout: 15
  # Write Timeout (seconds): The time limit for writing the response. Default is 30.
  write-timeout: 30
  # Idle Timeout (seconds): The maximum lifespan of a keep-alive idle connection. Default: 120
  idle-timeout: 120
  # Optional: Enable HTTPS directly through the api-server (requires your own certificate). Disabled by default.
  tls:
    enabled: false
    cert-file: "" # For example, /path/to/fullchain.pem
    key-file: "" # For example, /path/to/privkey.pem
  # ---- The following are suggestions for implementing "TLS reverse proxy" (pure comments, no changes to the logic) ----

name: Build Test

on:
  workflow_dispatch:
    inputs:
      BASE_IMAGE_NAMESPACE:
        description: 'Base image namespace (Default: Your Github username)'
        required: false
        default: ''
      DOCKERHUB_IMAGE_NAMESPACE:
        description: 'Docker Hub image namespace (Default: Your Github username)'
        required: false
        default: ''
      GHCR_IMAGE_NAMESPACE:
        description: 'GitHub Container Registry image namespace (Default: Your Github username)'
        required: false
        default: ''
      SKIP_DOCKER_HUB:
        description: 'Set to true to skip pushing to Docker Hub (default: false)'
        required: false
        default: 'false'
      SKIP_GHCR:
        description: 'Set to true to skip pushing to GHCR (default: false)'
        required: false
        default: 'false'
      WEBCLIENT_REPOSITORY:
        description: 'Web client repository in owner/repository format'
        required: true
        default: 'ymg2006/rustdesk-api-web'
      WEBCLIENT_REF:
        description: 'Web client branch, tag, or commit SHA'
        required: true
        default: 'master'

env:
  LATEST_TAG: latest
  DOCKER_BUILD_RECORD_UPLOAD: 'false'
  WEBCLIENT_REPOSITORY: ${{ github.event.inputs.WEBCLIENT_REPOSITORY || 'ymg2006/rustdesk-api-web' }}
  WEBCLIENT_REF: ${{ github.event.inputs.WEBCLIENT_REF || 'master' }}
  BASE_IMAGE_NAMESPACE: ${{ github.event.inputs.BASE_IMAGE_NAMESPACE || github.actor }}
  DOCKERHUB_IMAGE_NAMESPACE: ${{ github.event.inputs.DOCKERHUB_IMAGE_NAMESPACE || github.actor }}
  GHCR_IMAGE_NAMESPACE: ${{ github.event.inputs.GHCR_IMAGE_NAMESPACE || github.actor }}
  SKIP_DOCKER_HUB: ${{ github.event.inputs.SKIP_DOCKER_HUB || 'false' }}
  SKIP_GHCR: ${{ github.event.inputs.SKIP_GHCR || 'false' }}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        job:
          - { platform: "amd64", goos: "linux", file_ext: "tar.gz" }
          - { platform: "arm64", goos: "linux", file_ext: "tar.gz" }
          - { platform: "armv7l", goos: "linux", file_ext: "tar.gz" }
          - { platform: "amd64", goos: "windows", file_ext: "zip" }
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Checkout web client
        uses: actions/checkout@v7
        with:
          repository: ${{ env.WEBCLIENT_REPOSITORY }}
          path: rustdesk-api-web
          ref: ${{ env.WEBCLIENT_REF }}

      - name: Set up Go environment
        uses: actions/setup-go@v7
        with:
          go-version: '1.23'  # Select the Go version.

      - name: Set up npm
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: build rustdesk-api-web
        working-directory: rustdesk-api-web
        run: |
          npm install
          npm run build
          mkdir -p ../resources/admin/
          cp -ar dist/* ../resources/admin/

      - name: tidy
        run: go mod tidy

      - name: swag
        run: |
          go run github.com/swaggo/swag/cmd/swag@v1.16.3 init -g cmd/apimain.go --output docs/api --instanceName api --exclude http/controller/admin
          go run github.com/swaggo/swag/cmd/swag@v1.16.3 init -g cmd/apimain.go --output docs/admin --instanceName admin --exclude http/controller/api

      - name: Build for ${{ matrix.job.goos }}-${{ matrix.job.platform }}
        run: |
          mkdir release -p
          cp -ar resources release/
          cp -ar docs release/
          cp -ar conf release/
          mkdir -p release/data
          mkdir -p release/runtime
          if [ "${{ matrix.job.goos }}" = "windows" ]; then
            sudo apt-get install gcc-mingw-w64-x86-64 zip -y
            GOOS=${{ matrix.job.goos }} GOARCH=${{ matrix.job.platform }} CC=x86_64-w64-mingw32-gcc CGO_LDFLAGS="-static" CGO_ENABLED=1 go build -ldflags "-s -w" -o ./release/apimain.exe ./cmd/apimain.go
            echo @echo off > release/start.bat
            echo cmd /c \"%~dp0apimain.exe\" >> release/start.bat
            zip -r ${{ matrix.job.goos}}-${{ matrix.job.platform }}.${{matrix.job.file_ext}} ./release
          else
            if [ "${{ matrix.job.platform }}" = "arm64" ]; then
              MUSL_ARCHIVE="aarch64-linux-musl-cross.tgz"
              MUSL_URL="https://github.com/musl-cc/musl.cc/releases/download/v0.0.1/${MUSL_ARCHIVE}"

              curl --fail --location \
                --retry 5 \
                --retry-delay 3 \
                --retry-all-errors \
                --connect-timeout 20 \
                --max-time 300 \
                --output "${MUSL_ARCHIVE}" \
                "${MUSL_URL}"

              echo "c909817856d6ceda86aa510894fa3527eac7989f0ef6e87b5721c58737a06c38  ${MUSL_ARCHIVE}" | sha256sum --check
              tar -xf "${MUSL_ARCHIVE}"
              export PATH="${PATH}:${PWD}/aarch64-linux-musl-cross/bin"

              GOOS=${{ matrix.job.goos }} GOARCH=arm64 CC=aarch64-linux-musl-gcc CGO_LDFLAGS="-static" CGO_ENABLED=1 go build -ldflags "-s -w -linkmode=external -extldflags=-static" -o ./release/apimain ./cmd/apimain.go
            elif [ "${{ matrix.job.platform }}" = "armv7l" ]; then
              MUSL_ARCHIVE="arm-linux-musleabihf-cross.tgz"
              MUSL_URL="https://github.com/musl-cc/musl.cc/releases/download/v0.0.1/${MUSL_ARCHIVE}"

              curl --fail --location \
                --retry 5 \
                --retry-delay 3 \
                --retry-all-errors \
                --connect-timeout 20 \
                --max-time 300 \
                --output "${MUSL_ARCHIVE}" \
                "${MUSL_URL}"

              echo "11e155a090789c854afb5d91e57c81f441ccdb92f7f277789c3a6d5884a68e58  ${MUSL_ARCHIVE}" | sha256sum --check
              tar -xf "${MUSL_ARCHIVE}"
              export PATH="${PATH}:${PWD}/arm-linux-musleabihf-cross/bin"

              GOOS=${{ matrix.job.goos }} GOARCH=arm GOARM=7 CC=arm-linux-musleabihf-gcc CGO_LDFLAGS="-static" CGO_ENABLED=1 go build -ldflags "-s -w -linkmode=external -extldflags=-static" -o ./release/apimain ./cmd/apimain.go
            else
              sudo apt-get install musl musl-dev musl-tools -y
              GOOS=${{ matrix.job.goos }} GOARCH=${{ matrix.job.platform }} CC=musl-gcc CGO_LDFLAGS="-static" CGO_ENABLED=1 go build -ldflags "-s -w -linkmode=external -extldflags=-static" -o ./release/apimain ./cmd/apimain.go
            fi
            tar -czf ${{ matrix.job.goos}}-${{ matrix.job.platform }}.${{matrix.job.file_ext}} ./release
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: rustdesk-api-${{ matrix.job.goos }}-${{ matrix.job.platform }}
          path: |
            release/
            ${{ matrix.job.goos}}-${{ matrix.job.platform }}.${{matrix.job.file_ext}}

  deb-package:
    name: debian package - ${{ matrix.job.platform }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        job:
          - { platform: "amd64", goos: "linux", debian_platform: "amd64", crossbuild_package: ""}
          - { platform: "arm64", goos: "linux", debian_platform: "arm64", crossbuild_package: "crossbuild-essential-arm64" }
          - { platform: "armv7l", goos: "linux", debian_platform: "armhf", crossbuild_package: "crossbuild-essential-armhf" }
    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Create packaging env
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -y devscripts build-essential debhelper pkg-config ${{ matrix.job.crossbuild_package }}
          mkdir -p debian-build/${{ matrix.job.platform }}/bin

      - name: Download binaries
        uses: actions/download-artifact@v7
        with:
          name: rustdesk-api-${{ matrix.job.goos }}-${{ matrix.job.platform }}
          path: .

      - name: Unzip binaries
        run: |
          mkdir -p ${{ matrix.job.platform }}
          cp -ar release ${{ matrix.job.platform }}/release

      - name: Build package for ${{ matrix.job.platform }} arch
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_DIR="${{ matrix.job.platform }}/release"
          PACKAGE_DIR="debian-build/${{ matrix.job.platform }}"

          test -f "${RELEASE_DIR}/apimain"
          test -d "${RELEASE_DIR}/resources/admin"

          mkdir -p "${PACKAGE_DIR}/bin" data
          install -m 0755 "${RELEASE_DIR}/apimain" "${PACKAGE_DIR}/bin/rustdesk-api"

          # Stage the repository packaging files first.
          cp -a debian systemd conf data resources runtime "${PACKAGE_DIR}/"

          # Replace only the checked-in admin assets with the web client
          # generated by the matching architecture build artifact.
          rm -rf "${PACKAGE_DIR}/resources/admin"
          mkdir -p "${PACKAGE_DIR}/resources/admin"
          cp -a "${RELEASE_DIR}/resources/admin/." "${PACKAGE_DIR}/resources/admin/"

          sed 's/{{ ARCH }}/${{ matrix.job.debian_platform }}/' debian/control.tpl > "${PACKAGE_DIR}/debian/control"

          cd "${PACKAGE_DIR}"
          debuild -i -us -uc -b -a${{ matrix.job.debian_platform}}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: rustdesk-api-${{ matrix.job.debian_platform }}
          path: |
            debian-build/*.deb

  release:
    name: Create GitHub Release (test)
    needs: [build, deb-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts (Linux, Windows, and Debian)
        uses: actions/download-artifact@v7
        with:
          pattern: 'rustdesk-api-*'
          path: artifacts
          merge-multiple: false

      - name: Verify Windows release artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f artifacts/rustdesk-api-windows-amd64/windows-amd64.zip
          echo "Windows artifact ready: artifacts/rustdesk-api-windows-amd64/windows-amd64.zip"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: test
          allow_override: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/**/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Push Docker Image
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        job:
          - { platform: "amd64", goos: "linux",  docker_platform: "linux/amd64" }
          - { platform: "arm64", goos: "linux",  docker_platform: "linux/arm64" }
          - { platform: "armv7l", goos: "linux",  docker_platform: "linux/arm/v7" }
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: ${{ env.SKIP_DOCKER_HUB == 'false' }}  # Only log in if SKIP_DOCKER_HUB is false
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Log in to GitHub Container Registry
        if: ${{ env.SKIP_GHCR == 'false' }}  # Only log in if GHCR push is enabled
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: vars
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          else
            echo "TAG=test" >> $GITHUB_ENV  # Default to 'test' if not a tag
          fi

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.BASE_IMAGE_NAMESPACE }}/rustdesk-api

      - name: Download binaries
        uses: actions/download-artifact@v7
        with:
          name: rustdesk-api-${{ matrix.job.goos }}-${{ matrix.job.platform }}
          path: ./

      - name: Unzip binaries
        run: |
          mkdir -p ${{ matrix.job.platform }}
          cp -ar release ${{ matrix.job.platform }}/release

      - name: Build and push Docker image to Docker Hub ${{ matrix.job.platform }}
        if: ${{ env.SKIP_DOCKER_HUB == 'false' }}  # Only run this step if SKIP_DOCKER_HUB is false
        uses: docker/build-push-action@v7
        with:
          context: "."
          file: ./Dockerfile
          platforms: ${{ matrix.job.docker_platform }}
          push: true
          provenance: false
          build-args: |
            BUILDARCH=${{ matrix.job.platform }}
          tags: |
            ${{ env.DOCKERHUB_IMAGE_NAMESPACE }}/rustdesk-api:${{ env.TAG }}-${{ matrix.job.platform }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push Docker image to GHCR ${{ matrix.job.platform }}
        if: ${{ env.SKIP_GHCR == 'false' }}  # Only run this step if SKIP_GHCR is false
        uses: docker/build-push-action@v7
        with:
          context: "."
          file: ./Dockerfile
          platforms: ${{ matrix.job.docker_platform }}
          push: true
          provenance: false
          build-args: |
            BUILDARCH=${{ matrix.job.platform }}
          tags: |
            ghcr.io/${{ env.GHCR_IMAGE_NAMESPACE }}/rustdesk-api:${{ env.TAG }}-${{ matrix.job.platform }}
          labels: ${{ steps.meta.outputs.labels }}

  #
  docker-manifest:
    name: Push Docker Manifest
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Extract version from tag
        id: vars
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          else
            echo "TAG=test" >> $GITHUB_ENV  # Default to 'test' if not a tag
          fi

      - name: Log in to Docker Hub
        if: ${{ env.SKIP_DOCKER_HUB == 'false' }}  # Only log in if Docker Hub push is enabled
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Log in to GitHub Container Registry
        if: ${{ env.SKIP_GHCR == 'false' }}  # Only log in if GHCR push is enabled
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest Docker Hub (:version)
        if: ${{ env.SKIP_DOCKER_HUB == 'false' }}
        uses: Noelware/docker-manifest-action@v0.2.3
        with:
          base-image: ${{ env.BASE_IMAGE_NAMESPACE }}/rustdesk-api:${{ env.TAG }}
          extra-images: ${{ env.DOCKERHUB_IMAGE_NAMESPACE }}/rustdesk-api:${{ env.TAG }}-amd64,
            ${{ env.DOCKERHUB_IMAGE_NAMESPACE }}/rustdesk-api:${{ env.TAG }}-armv7l,
            ${{ env.DOCKERHUB_IMAGE_NAMESPACE }}/rustdesk-api:${{ env.TAG }}-arm64
          push: true

      - name: Create and push manifest GHCR (:version)
        if: ${{ env.SKIP_GHCR == 'false' }}
        uses: Noelware/docker-manifest-action@v0.2.3
        with:
          base-image: ghcr.io/${{ env.BASE_IMAGE_NAMESPACE }}/rustdesk-api:${{ env.TAG }}
          extra-images: ghcr.io/${{ env.GHCR_IMAGE_NAMESPACE }}/rustdesk-api:${{ env.TAG }}-amd64,
            ghcr.io/${{ env.GHCR_IMAGE_NAMESPACE }}/rustdesk-api:${{ env.TAG }}-armv7l,
            ghcr.io/${{ env.GHCR_IMAGE_NAMESPACE }}/rustdesk-api:${{ env.TAG }}-arm64
          push: true
          amend: true
